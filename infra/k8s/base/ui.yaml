apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetic-ui
  namespace: assetic-poc
  labels:
    app.kubernetes.io/name: assetic-ui
    app.kubernetes.io/part-of: assetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assetic-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assetic-ui
    spec:
      initContainers:
        # Build the UI from source: extract, install deps, build static files
        - name: build
          image: node:20-alpine
          workingDir: /build
          command:
            - sh
            - -c
            - |
              set -e
              echo "Extracting UI source..."
              tar xzf /src/source.tar.gz -C /build
              echo "Installing dependencies..."
              npm install --no-audit --no-fund
              echo "Building UI..."
              npx tsc --noEmit || true
              npx vite build
              echo "Copying built files to nginx volume..."
              cp -r /build/dist/* /nginx/
              echo "UI build complete."
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
            - name: built
              mountPath: /build
            - name: nginx-html
              mountPath: /nginx
      containers:
        - name: ui
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: assetic-ui-source
        - name: nginx-config
          configMap:
            name: assetic-ui-nginx-config
        - name: nginx-html
          emptyDir: {}
        - name: built
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assetic-ui
  namespace: assetic-poc
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: assetic-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http