apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: assetic-poc
data:
  realm.json: |
    {
      "realm": "assetic",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "clients": [
        {
          "clientId": "assetic-ui",
          "name": "assetic UI",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://localhost:5173/callback",
            "http://localhost:30080/callback",
            "http://127.0.0.1:5173/callback"
          ],
          "webOrigins": [
            "http://localhost:5173",
            "http://localhost:30080",
            "http://127.0.0.1:5173"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "assetic-api",
          "name": "assetic API",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "assetic-api-secret-dev",
          "serviceAccountsEnabled": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "bearerOnly": true
        }
      ],
      "roles": {
        "realm": [
          { "name": "asset_manager" },
          { "name": "account_manager" },
          { "name": "trip_manager" },
          { "name": "maintenance" },
          { "name": "loading_team" },
          { "name": "on_board_staff" },
          { "name": "analytics" },
          { "name": "sysadmin" }
        ]
      },
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@assetic.local",
          "firstName": "Admin",
          "lastName": "User",
          "credentials": [{ "type": "password", "value": "admin", "temporary": false }],
          "realmRoles": ["asset_manager", "account_manager", "trip_manager", "sysadmin"]
        },
        {
          "username": "tripmgr",
          "enabled": true,
          "email": "tripmgr@assetic.local",
          "firstName": "Trip",
          "lastName": "Manager",
          "credentials": [{ "type": "password", "value": "tripmgr", "temporary": false }],
          "realmRoles": ["trip_manager"]
        },
        {
          "username": "loader",
          "enabled": true,
          "email": "loader@assetic.local",
          "firstName": "Loading",
          "lastName": "Operator",
          "credentials": [{ "type": "password", "value": "loader", "temporary": false }],
          "realmRoles": ["loading_team"]
        },
        {
          "username": "viewer",
          "enabled": true,
          "email": "viewer@assetic.local",
          "firstName": "Read",
          "lastName": "Only",
          "credentials": [{ "type": "password", "value": "viewer", "temporary": false }],
          "realmRoles": ["analytics"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: assetic-poc
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: assetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_DB
              value: "dev-file"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: assetic-poc
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 8080
      name: http