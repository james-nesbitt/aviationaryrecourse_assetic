# Template only. The real Secret is created out-of-band so no credential
# value lives in git (see README "Secrets"). kubectl apply of this file
# with real values is NOT the deploy path; apply it once with --dry-run to
# verify shape, then create the real Secret with:
#   kubectl -n assetic-poc create secret generic assetic-db-credentials \
#     --from-literal=DATABASE_URL="postgresql://assetic:<pw>@assetic-postgres:5432/assetic?schema=public" \
#     --from-literal=POSTGRES_USER=assetic --from-literal=POSTGRES_PASSWORD=<pw> --from-literal=POSTGRES_DB=assetic
apiVersion: v1
kind: Secret
metadata:
  name: assetic-db-credentials
  namespace: assetic-poc
type: Opaque
stringData:
  # placeholder values: replaced by the out-of-band create above
  DATABASE_URL: "postgresql://assetic:REPLACE_ME@assetic-postgres:5432/assetic?schema=public"
  POSTGRES_USER: "assetic"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "assetic"
---
# Non-secret configuration only. These are not credentials; keeping them in
# git is fine and intentional.
apiVersion: v1
kind: Secret
metadata:
  name: assetic-api-config
  namespace: assetic-poc
type: Opaque
stringData:
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "assetic"
  KEYCLOAK_CLIENT_ID: "assetic-api"
  KEYCLOAK_UI_CLIENT_ID: "assetic-ui"
  UI_URL: "http://assetic-ui"
  PORT: "3001"
  HOST: "0.0.0.0"