apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetic-api
  namespace: assetic-poc
  labels:
    app.kubernetes.io/name: assetic-api
    app.kubernetes.io/part-of: assetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assetic-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assetic-api
    spec:
      containers:
        - name: api
          image: assetic/api:latest
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: assetic-api-config
            - secretRef:
                name: assetic-db-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assetic-api
  namespace: assetic-poc
spec:
  selector:
    app.kubernetes.io/name: assetic-api
  ports:
    - port: 3001
      name: http