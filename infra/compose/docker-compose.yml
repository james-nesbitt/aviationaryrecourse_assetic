# assetic POC — local docker-compose stack
# Brings up Postgres, Keycloak, API, and UI for local development.
# Usage: docker compose -f infra/compose/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assetic
      POSTGRES_PASSWORD: pg-dev-pw-01
      POSTGRES_DB: assetic
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetic"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/realm-import.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15

  assetic-api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "assetic"
      KEYCLOAK_CLIENT_ID: "assetic-api"
      KEYCLOAK_UI_CLIENT_ID: "assetic-ui"
      UI_URL: "http://localhost:5173"
      PORT: "3001"
      HOST: "0.0.0.0"
    ports:
      - "3001:3001"

  assetic-ui:
    build:
      context: ../../ui
      dockerfile: Dockerfile
    depends_on:
      - assetic-api
    ports:
      - "5173:80"

volumes:
  postgres-data: