# Project-local oh-my-pi configuration for assetic.
#
# Pins every chat role to ollama-cloud/glm-5.3 so all sessions, subagents
# and planning/advisory turns in this repository use the same model.
# Model-kind roles (image, web, speech, dictation, judge) stay on their
# global defaults: glm-5.3 is a chat model and cannot serve them.
#
# Settings precedence: built-in defaults < global config < THIS FILE <
# CLI overlays < runtime overrides < setting env vars. To pin here is to
# override the global default for any omp session started in this
# directory; nothing outside the project is affected.
modelRoles:
  default: ollama-cloud/glm-5.3:high
  smol: ollama-cloud/glm-5.3:low
  slow: ollama-cloud/glm-5.3:high
  plan: ollama-cloud/glm-5.3:high
  commit: ollama-cloud/glm-5.3:low
  task: ollama-cloud/glm-5.3:high
  advisor: ollama-cloud/glm-5.3:high
  tiny: ollama-cloud/glm-5.3:low
  memory: ollama-cloud/glm-5.3:low